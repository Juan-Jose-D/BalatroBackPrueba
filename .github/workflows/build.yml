name: Build

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            # Verificar que el reporte XML existe
            if [ -f "target/site/jacoco/jacoco.xml" ]; then
              echo "✅ JaCoCo XML report found at target/site/jacoco/jacoco.xml"
              ls -lh target/site/jacoco/
            else
              echo "⚠️ Warning: JaCoCo XML report not found. Coverage may not be available."
              echo "Checking target/site/jacoco/ directory:"
              ls -la target/site/jacoco/ 2>/dev/null || echo "Directory does not exist"
            fi
            mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=Arsw-Balatro \
              -Dsonar.projectName='Arsw Balatro' \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN || echo "SonarQube analysis skipped (secrets not configured)"
          else
            echo "SonarQube analysis skipped (SONAR_TOKEN or SONAR_HOST_URL not configured)"
          fi

