# Configuración de test para BalatroBackendApplicationTest
# Este archivo proporciona valores mock para evitar dependencias externas durante los tests

# AWS Cognito Configuration (valores de prueba)
aws.cognito.user-pool-id=us-east-1_TEST123
aws.cognito.client-id=test-client-id
aws.cognito.region=us-east-1
aws.cognito.jwk-url=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_TEST123/.well-known/jwks.json

# Server Configuration
server.port=0
spring.application.name=balatro-backend-test

# WebSocket Configuration
spring.websocket.servlet.allowed-origins=http://localhost:3000
spring.websocket.message-size-limit=65536

# CORS Configuration
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging (reducido para tests)
logging.level.com.arsw.balatro=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging=WARN

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never





